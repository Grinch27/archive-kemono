# 待确认：被检查的暂存Release；歧义：下载次数不等于去重后的媒体数量。
# 后续研究：仅在需要时核查失败类别；潜在优化：无。
# 风险：云端解压一个样本批次做校验，不输出原文；仅做可信官方HTTPS路径HEAD，不自动换源。
# 验证重点：只读、计数、权限隔离、gzip完整性、原件失败码及HEAD时序。
name: Favourite archive inspect
on:
  push:
    branches: [main]
    paths: [.github/workflows/kemono-favorites-inspect.yml]
  workflow_dispatch:
    inputs:
      release_id:
        description: "暂存Release ID"
        type: string
        default: "413942089"
        required: true
permissions: write-all
env:
  CONTAINER_IMAGE: &container_image ubuntu:devel
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
jobs:
  runner-image:
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve.outputs.RUNNER_IMAGE }}
    steps:
      - id: resolve
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main
  inspect:
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    container:
      image: *container_image
    timeout-minutes: 10
    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get -yqq update
          apt-get -yqq install --no-install-recommends ca-certificates curl python3 gh git
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - name: Read completed batch counters
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ID: ${{ inputs.release_id || '413942089' }}
        run: |
          python3 -u - <<'PY'
          import collections
          import gzip
          import json
          import os
          import re
          import sys
          import subprocess
          import tarfile
          import urllib.parse
          sys.path.insert(0, 'scripts')
          import kemono_favorites as app
          release_id = int(os.environ['STAGING_ID'])
          totals, count, sample = collections.Counter(), 0, None
          for item in sorted(app.assets(release_id), key=lambda x: x['name']):
              if not re.fullmatch(r'batch-[0-9]{5}\.json', item['name']):
                  continue
              batch = app.gh('api', f"repos/{app.repo()}/releases/assets/{item['id']}",
                             '-H', 'Accept: application/octet-stream')
              counts = batch['counts']
              if any(not isinstance(v, int) or v < 0 for v in counts.values()):
                  raise ValueError('invalid archive counters')
              totals.update(counts)
              count += 1
              if batch['index'] == 4:
                  sample = batch
          print('ARCHIVE_COUNTERS=' + json.dumps({'completed_batches': count, **totals}, sort_keys=True))
          if sample:
              codes, members = collections.Counter(), collections.Counter()
              head_url = None
              reader = app.PartReader(sample['parts'])
              try:
                  with gzip.GzipFile(fileobj=reader, mode='rb') as compressed:
                      with tarfile.open(fileobj=compressed, mode='r|') as archive:
                          for member in archive:
                              app.safe_member(member)
                              if member.name.startswith('media/'):
                                  members['original_files'] += 1
                              if member.name.startswith('previews/'):
                                  members['preview_files'] += 1
                              if member.name.endswith('/status.json'):
                                  with archive.extractfile(member) as source:
                                      status = json.load(source)
                                  for record in status['media']:
                                      failure = record.get('original_failure')
                                      if failure:
                                          codes[str(failure['exit_code'])] += 1
                                          head_url = head_url or record.get('url')
                      while compressed.read(1048576):
                          pass
                  if reader.position != len(sample['parts']):
                      raise ValueError('sample archive not fully consumed')
              finally:
                  reader.close()
              print('SAMPLE_ARCHIVE_CHECK=' + json.dumps({'verified_gzip': True, **members,
                    'original_failure_record_codes': dict(codes)}, sort_keys=True))
              if head_url and app.base.media_host(head_url):
                  env = {k: v for k, v in os.environ.items()
                         if not k.startswith(('GH_', 'GITHUB_', 'KEMONO_', 'ACTIONS_'))}
                  candidates = [('api_node', head_url),
                      ('official_root', app.base.BASE + urllib.parse.urlsplit(head_url).path)]
                  for label, url in candidates:
                      result = subprocess.run(['curl', '--disable', '--head', '--silent', '--show-error',
                          '--proto', '=https', '--noproxy', '*', '--retry', '0', '--connect-timeout', '5',
                          '--max-time', '10', '--output', '/dev/null', '--write-out',
                          'http=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n%{redirect_url}',
                          url], env=env, capture_output=True, timeout=12)
                      timing, _, redirect = result.stdout.decode('ascii', errors='replace').partition('\n')
                      destination = urllib.parse.urlsplit(redirect)
                      print('HEAD_DIAGNOSTIC=' + str(result.returncode) + ' ' + label + ' ' + timing
                            + ' redirect_scheme=' + destination.scheme
                            + ' redirect_host=' + str(destination.hostname))
                      if label == 'official_root' and redirect:
                          secured = urllib.parse.urlunsplit(('https', destination.netloc,
                              destination.path, destination.query, destination.fragment))
                          if app.base.media_host(secured):
                              candidates.append(('official_redirect_https', secured))
          PY
