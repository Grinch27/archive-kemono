# 待确认：云端原文件可达性、总容量；后续研究：大作者跨运行恢复。
# 潜在优化：分片并行；风险：运行会创建公开Release，失败保留草稿。
# 验证重点：媒体1次/3秒、Python只处理数据、工作流上传确认后继续分卷、失败不发布、每卷低于2GB。
name: Kemono author to Release

# GitHub Actions workflow syntax reference:
# https://docs.github.com/zh/actions/reference/workflows-and-actions/workflow-syntax
# https://docs.github.com/zh/actions/reference/workflows-and-actions/metadata-syntax#runs-for-composite-actions
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#yaml-anchors-and-aliases

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*.yml"
  workflow_dispatch:
    inputs:
      creator_url:
        description: "作者URL"
        required: true
        type: string
        default: "https://kemono.cr/patreon/user/4068015"
      max_posts:
        description: "最多下载帖子数；0表示全部，首次可填3试运行"
        required: true
        type: string
        default: "0"
      part_mb:
        description: "每卷上限，十进制MB；允许10–1900"
        required: true
        type: string
        default: "1800"
      compression:
        description: "压缩格式；xz参照模板，gzip较快"
        required: true
        type: choice
        options:
          - xz
          - gzip
        default: xz
      user_agent:
        description: "下载User-Agent"
        required: true
        type: string
        default: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.7194.92 Safari/537.36"

permissions: write-all

defaults:
  run:
    shell: bash

# concurrency:
#   group: kemono-release-${{ github.ref }}
#   cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: "true"
  APT_LISTCHANGES_FRONTEND: none
  NEEDRESTART_MODE: a
  FORCE_UNSAFE_CONFIGURE: "1"
  TZ: Etc/UTC
  DISPLAY_TZ: Etc/UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # Git
  GIT_TERMINAL_PROMPT: "0"
  # Docker/BuildKit
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

run-name: Archive ${{ inputs.creator_url || 'https://kemono.cr/patreon/user/4068015' }}

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: &step_image ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  action:
    name: >-
      ${{ needs.runner-image.outputs.RUNNER_IMAGE }} -
    needs:
      - runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    timeout-minutes: 330
    container:
      image: &container_image ubuntu:devel
      options: &container_options >-
        --privileged
        --user=0:0
        --pid=host
        --ipc=host
        --uts=host
        --cgroupns=host
        --cap-add=ALL
        --security-opt apparmor=unconfined
        --security-opt seccomp=unconfined
        --init
        --pids-limit=-1
        --shm-size=12g
        --ulimit nofile=1048576:1048576
      volumes: &container_volumes
        - /dev:/dev
        - /sys:/sys:rw
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
        - /run/udev:/run/udev:ro
        - /lib/modules:/lib/modules:ro
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      DEBIAN_FRONTEND: noninteractive
      FORCE_UNSAFE_CONFIGURE: "1"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
      GH_REPO: ${{ github.repository }}
      ARCHIVE_DIR: ${{ runner.temp }}/kemono-archive
      CREATOR_URL: ${{ inputs.creator_url || 'https://kemono.cr/patreon/user/4068015' }}
    steps:
      - name: Install Tools
        id: apt-download
        working-directory: /
        run: |
          set -euo pipefail
          unset http_proxy https_proxy all_proxy no_proxy
          export no_proxy='*'
          run_root() {
            if command -v sudo >/dev/null 2>&1; then
              sudo "$@"
            else
              "$@"
            fi
          }
          run_root apt-get -yqq update
          run_root apt-get -yqq install --no-install-recommends ca-certificates curl xz-utils python3 gh git
          python3 --version
          gh --version
          git --version
          curl --version
          xz --version

      - name: Checkout
        uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -q -b

      - name: Create Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$CREATOR_URL" =~ ^https://kemono\.cr/([a-z0-9_-]+)/user/([A-Za-z0-9_-]+)/?$ ]]; then
            echo '::error::作者URL无效'
            exit 1
          fi
          service=${BASH_REMATCH[1]}
          user=${BASH_REMATCH[2]}
          tag="kemono-$service-$user-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          release_id=$(gh api --method POST "repos/$GH_REPO/releases" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
            -F draft=true -f name="$service/$user" --jq '.id')
          [[ "$release_id" =~ ^[0-9]+$ ]]
          printf 'RELEASE_TAG=%s\nRELEASE_ID=%s\n' "$tag" "$release_id" >> "$GITHUB_ENV"

      - name: Process archive and upload ready parts
        id: archive
        env:
          MAX_POSTS: ${{ inputs.max_posts || '0' }}
          PART_MB: ${{ inputs.part_mb || '1800' }}
          COMPRESSION: ${{ inputs.compression || 'xz' }}
          USER_AGENT: ${{ inputs.user_agent || 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.7194.92 Safari/537.36' }}
          KEMONO_USERNAME: ${{ secrets.KEMONO_USERNAME }}
          KEMONO_PASSWORD: ${{ secrets.KEMONO_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset http_proxy https_proxy all_proxy no_proxy
          export no_proxy='*'
          # Python has no GitHub token; acknowledge each part only after upload verification.
          coproc ARCHIVER { env -u GH_TOKEN -u GITHUB_TOKEN python3 -u scripts/kemono_release.py; }
          archive_pid=$ARCHIVER_PID
          exec 3<&"${ARCHIVER[0]}" 4>&"${ARCHIVER[1]}"
          trap 'kill "$archive_pid" 2>/dev/null || true' EXIT
          while IFS= read -r line <&3; do
            if [[ "$line" == ARCHIVE_PART=* ]]; then
              name=${line#ARCHIVE_PART=}
              [[ "$name" =~ ^[a-z0-9_-]+-[A-Za-z0-9_-]+\.tar\.(xz|gz)\.part[0-9]{5}$ ]]
              path="$ARCHIVE_DIR/$name"
              size=$(stat -c %s "$path")
              (( size > 0 && size < 2000000000 ))
              gh release upload "$RELEASE_TAG" "$path" --clobber
              state=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --paginate \
                --jq ".[] | select(.name == \"$name\") | \"\\(.state):\\(.size)\"")
              [[ "$state" == "uploaded:$size" ]]
              printf '%s\n' "$name" >&4
            else
              printf '%s\n' "$line"
            fi
          done
          wait "$archive_pid"
          exec 3<&- 4>&-
          trap - EXIT

      - name: Upload metadata and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ steps.archive.outputs.title }}
          INCOMPLETE: ${{ steps.archive.outputs.incomplete }}
        run: |
          set -euo pipefail
          assets=("$ARCHIVE_DIR/archive-manifest.json")
          if [[ -f "$RUNNER_TEMP/failed-files.json" ]]; then
            assets+=("$RUNNER_TEMP/failed-files.json")
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          for path in "${assets[@]}"; do
            name=${path##*/}
            size=$(stat -c %s "$path")
            state=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --paginate \
              --jq ".[] | select(.name == \"$name\") | \"\\(.state):\\(.size)\"")
            [[ "$state" == "uploaded:$size" ]]
          done
          [[ -n "$RELEASE_TITLE" && "$INCOMPLETE" =~ ^(true|false)$ ]]
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" \
            --notes-file "$ARCHIVE_DIR/release-notes.md" \
            --prerelease="$INCOMPLETE" --draft=false
          echo "::notice::Release已发布：https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG"

      - name: Preserve failed-file list
        if: always()
        uses: actions/upload-artifact@main # v4.6.2
        with:
          name: failed-files-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failed-files.json
          if-no-files-found: ignore
          retention-days: 30
